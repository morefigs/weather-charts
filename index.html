<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Charts</title>
  <link rel="icon" type="image/x-icon" href="weather.png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #121212;
      color: #ffffff;
    }
    canvas {
      background: #1e1e1e;
      border: 1px solid #444;
      margin-bottom: 30px;
    }
    #add-location-btn {
      background: #333;
      color: #fff;
      border: 1px solid #444;
      cursor: pointer;
    }
    .result-item:hover {
      background: #333;
    }
    #search-results {
      max-width: 300px;
      max-height: 240px;
      overflow-y: auto;
      background: #1e1e1e;
      border: 1px solid #444;
    }
    #search-results:empty {
      border: none;
    }
    #saved-locations {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: center;
    }
    .remove-btn {
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 14px;
    }
  </style>
</head>
<body>
<div id="location-controls" style="display:flex; gap:20px; align-items:center; margin-bottom: 20px;">
  <div id="search-wrap">
    <input type="text" id="location-search" placeholder="Search for a city..."
           style="padding: 8px; width: 250px; background:#1e1e1e; color:#fff; border:1px solid #444;" />
    <button id="add-location-btn" style="padding: 8px 12px;">Add</button>
    <div id="search-results" style="margin-top:5px;"></div>
  </div>
  <div id="saved-locations"></div>
  <select id="model-select" style="margin-left:auto; padding:8px; background:#1e1e1e; color:#fff; border:1px solid #444;"></select>
</div>

<div id="charts"></div>

<script type="text/javascript" src="weather_charts.js"></script>
</body>
</html>
